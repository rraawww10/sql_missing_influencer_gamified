<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Missing Influencer Analytics</title>
<!--
  The team's dashboard (2026-11-19 rebuild). Four tabs, each starting from a decision:
    Now       who needs help today, how many play, how happy they are (11-star scale), where they are
    Students  everyone at a glance (13-episode journey strip); one student = every interaction they had, SQL included
    Feedback  the 11-star ladder (5 = as expected, 6-7 = the target), per episode, and every "one star better" suggestion
    Episodes  opened vs solved, time, first-try SQL, stars, then step by step for one episode
  Charts follow the dataviz rules: one blue series, hairline grid, thin bars with a rounded data end, hover tooltips,
  status colours only with an icon and a label.
-->
<style>
:root{
  --bg:#f6f6f3;--panel:#fff;--panel-2:#f2f1ec;--line:#e1e0d9;--text:#0b0b0b;--muted:#52514e;--faint:#898781;
  --s1:#2a78d6;--s1-hi:#1c5cab;--s1-2:#86b6ef;--s1-soft:#e1edfb;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d;--panel:#1a1a19;--panel-2:#242422;--line:#2c2c2a;--text:#f0efec;--muted:#c3c2b7;--faint:#898781;
  --s1:#3987e5;--s1-hi:#6da7ec;--s1-2:#184f95;--s1-soft:#16263b;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0d0d0d;--panel:#1a1a19;--panel-2:#242422;--line:#2c2c2a;--text:#f0efec;--muted:#c3c2b7;--faint:#898781;
  --s1:#3987e5;--s1-hi:#6da7ec;--s1-2:#184f95;--s1-soft:#16263b;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px}
[hidden]{display:none!important}

/* header */
header{background:linear-gradient(110deg,#6d28d9,#db2777 55%,#f59e0b);color:#fff;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 4px}
.top h1{font-size:16px;margin:0;font-weight:680;letter-spacing:-.01em}
.spacer{flex:1}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
header .btn{background:#ffffff22;border-color:#ffffff44;color:#fff}header .btn:hover{background:#ffffff38}
header select{background:#ffffff22;border-color:#ffffff44;color:#fff}header select option{color:#000}
header label.chk{color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:0 6px;white-space:nowrap;font-weight:600}
.live .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 #4ade8088;animation:livepulse 2s infinite}
@keyframes livepulse{70%{box-shadow:0 0 0 8px #4ade8000}100%{box-shadow:0 0 0 0 #4ade8000}}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:#ffffffc0;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center;font-weight:550}
nav.tabs button[aria-selected=true]{color:#fff;border-color:#fff}
nav.tabs .badge{background:#fff;color:#b4235a;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:700}

/* controls */
select,input[type=search],input[type=password],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:inherit;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.small{padding:4px 10px;font-size:13px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.seg{display:inline-flex;background:var(--panel-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:13px;display:inline-flex;gap:5px;align-items:center}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{min-width:min(100%,240px)}

/* layout */
main.wrap{padding:18px 16px 60px}
.grid{display:grid;gap:12px}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));margin-top:12px}
.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:14px;margin:0 0 10px;font-weight:650;display:flex;gap:8px;align-items:center}
.card h2 .n{color:var(--faint);font-weight:500}
.card h2 .more{margin-left:auto}
.info{color:var(--faint);cursor:help;display:inline-flex}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.empty{padding:22px;text-align:center;color:var(--faint)}

/* stat tiles */
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,var(--k1),var(--k2));cursor:default}
.kpi.go{cursor:pointer}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.kpi .v small{font-size:15px;opacity:.85;font-weight:600}
.kpi .l{color:#ffffffe8;font-size:13px;font-weight:600}
.kpi .ico{position:absolute;right:12px;top:12px;opacity:.9}.kpi .ico svg{width:26px;height:26px}
.k1{--k1:#7c3aed;--k2:#a855f7}.k2{--k1:#0e7490;--k2:#06b6d4}.k3{--k1:#047857;--k2:#10b981}.k4{--k1:#d97706;--k2:#f59e0b}.k5{--k1:#be185d;--k2:#ec4899}
.mini{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mini .card{padding:10px 12px;border-radius:12px}
.mini .v{font-size:20px;font-weight:680}.mini .l{color:var(--muted);font-size:12px}

/* status chips: colour + icon + words, never colour alone */
.chip{--c:var(--faint);display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:99px;font-size:12px;font-weight:550;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);color:var(--text)}
.chip svg.i{width:13px;height:13px;color:var(--c)}
.good{--c:var(--good)}.warn{--c:var(--warn)}.serious{--c:var(--serious)}.crit{--c:var(--crit)}.mute{--c:var(--faint)}.blue{--c:var(--s1)}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:650;white-space:nowrap}
.stars svg.i{width:14px;height:14px;color:var(--warn);fill:var(--warn)}
.stars small{color:var(--faint);font-weight:500}

/* charts */
.plot{display:block;width:100%;height:auto;overflow:visible}
.plot .gl{stroke:var(--line);stroke-width:1}
.plot .ax{fill:var(--faint);font-size:11px}
.plot .lab{fill:var(--muted);font-size:11.5px}
.plot .bar{fill:var(--s1)}
.plot .bar.lite{fill:var(--s1-2)}
.plot g:hover .bar{fill:var(--s1-hi)}
.plot .hit{fill:transparent}
.plot .band{fill:var(--s1-soft)}
.plot .med{stroke:var(--text);stroke-width:2}
.plot .dot{fill:var(--s1);stroke:var(--panel);stroke-width:2}
.plot g:hover .dot{fill:var(--s1-hi)}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--panel);font-size:12.5px;padding:6px 9px;border-radius:8px;max-width:300px;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hb{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:7px 10px;align-items:center;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{position:relative;height:14px}
.hb .tr b{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0;max-width:100%}
.hb .tr b.lite{background:var(--s1-2)}
.hb .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}

/* needs you */
.need{display:grid;gap:6px}
.need-row{display:grid;grid-template-columns:32px minmax(110px,170px) 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 10px;cursor:pointer;text-align:left}
.need-row:hover{background:var(--panel-2)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s1-soft);color:var(--s1-hi);font-weight:700;font-size:12px}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--faint)}
.why{display:flex;gap:4px;flex-wrap:wrap}
.when{color:var(--faint);font-size:12px;white-space:nowrap}
.allgood{display:flex;gap:8px;align-items:center;padding:18px;color:var(--muted)}.allgood svg{color:var(--good)}

/* voices (suggestion cards) */
.wall{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.voice{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c,var(--line))}
.voice:hover{background:var(--panel-2)}
.voice .top2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.voice .q{font-size:15px;line-height:1.4}
.voice .q.none{color:var(--faint);font-size:13px}
.voice .by{color:var(--faint);font-size:12px;margin-top:auto}
.voice .lad{color:var(--muted);font-size:12.5px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--panel-2);position:sticky;top:0;cursor:pointer;user-select:none;z-index:1}
th.nosort{cursor:default}
th[aria-sort=ascending]::after{content:" ▲";font-size:9px}th[aria-sort=descending]::after{content:" ▼";font-size:9px}
tbody tr:hover{background:var(--panel-2)}
tr.click{cursor:pointer}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:240px}
tr.sel{background:var(--s1-soft)!important}
.pb{display:flex;align-items:center;gap:8px;min-width:110px}
.pb .tr{flex:1;height:8px;background:var(--panel-2);border-radius:4px;position:relative}
.pb .tr b{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:4px}
.pb span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:34px;text-align:right}
.type{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--panel-2);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.type.task{background:var(--s1-soft);color:var(--s1-hi)}
tr.hot{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.flags{display:inline-flex;gap:3px}.flags svg{width:15px;height:15px}

/* journey strip: 13 episodes */
.jr{display:inline-flex;gap:2px;vertical-align:middle}
.jr i{width:9px;height:16px;border-radius:2px;border:1px solid var(--line);background:transparent;font-style:normal}
.jr i.s1{background:var(--s1-2);border-color:var(--s1-2)}
.jr i.s2{background:var(--s1);border-color:var(--s1)}
.jr i.cur{outline:2px solid var(--text);outline-offset:1px}
.jr.big{display:flex;width:100%;gap:4px}
.jr.big i{flex:1;height:34px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--muted)}
.jr.big i.s2{color:#fff}
.jr.big i.s1{color:var(--text)}

/* drawer + timeline */
.drawer{position:fixed;inset:0;display:none;z-index:20}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.drawer .sheet{position:absolute;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.sheet .head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;z-index:3}
.sheet .head .av{width:42px;height:42px;font-size:15px}
.sheet .body{padding:16px}
.sheet h3{font-size:13px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center}
.tl-day{font-size:12px;color:var(--faint);margin:14px 0 2px;font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.tl-item{display:grid;grid-template-columns:62px 28px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.tl-time{font-size:12px;color:var(--faint);padding-top:4px;white-space:nowrap}
.tl-ico{--c:var(--faint);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--c)}
.tl-ico svg.i{width:15px;height:15px;vertical-align:0}
.tl-main{min-width:0}
.tl-main .t{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl-main .m{color:var(--muted);font-size:12.5px}
.tl-main blockquote{margin:4px 0 0;padding:6px 10px;border-left:3px solid var(--s1);background:var(--panel-2);border-radius:0 8px 8px 0}
code.sql{display:block;white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--panel-2);padding:6px 9px;border-radius:8px;margin-top:4px;max-height:180px;overflow:auto;word-break:break-word}
details.ep{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
details.ep summary{list-style:none;cursor:pointer;padding:9px 12px;display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(110px,1fr) 70px 90px auto;gap:10px;align-items:center}
details.ep summary::-webkit-details-marker{display:none}
details.ep[open] summary{border-bottom:1px solid var(--line)}
details.ep .inner{padding:8px 12px 12px;overflow-x:auto}

/* feedback */
.hero{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.hero .big{font-size:46px;font-weight:750;letter-spacing:-.03em;line-height:1}
.hero .big small{font-size:18px;color:var(--faint);font-weight:600}
.hero .facts{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.eprow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(180px,300px) 40px 54px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.eprow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eprow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.eprow.head{color:var(--faint);font-size:11.5px}
.chapters{display:grid;gap:6px}
.chapters .row{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:8px;align-items:center;font-size:13px}
.chapters .cells{display:flex;gap:4px;flex-wrap:wrap}

/* login */
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .card{padding:24px}
.login h1{font-size:18px;margin:0 0 4px}
.login input{width:100%;margin:14px 0 10px}
.err{color:var(--crit);font-size:13px;min-height:18px}

@media (max-width:700px){
  .need-row{grid-template-columns:32px 1fr;}.need-row .why{grid-column:1/-1}.need-row .when{display:none}
  details.ep summary{grid-template-columns:1fr 1fr}
  .eprow{grid-template-columns:1fr 150px 30px 44px}
  .hero .big{font-size:38px}
  .top h1{font-size:15px}
}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <form class="card" id="loginForm">
    <h1>Missing Influencer Analytics</h1>
    <div class="muted">Team sign in</div>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div>

<div id="app" hidden>
<header>
  <div class="wrap">
    <div class="top">
      <h1>SQL: The Missing Influencer</h1>
      <span class="live" id="liveNow" data-tip="Students with any activity in the last 5 minutes"></span>
      <div class="spacer"></div>
      <div class="ctl">
        <select id="batch" aria-label="Batch" hidden><option value="">All batches</option></select>
        <label class="chk" hidden><input type="checkbox" id="guests"> Guests</label>
        <button class="btn" id="refresh" data-tip="Reload the numbers" aria-label="Refresh"></button>
        <a class="btn" id="export" href="/api/admin/export.csv" data-tip="Every student, one row each (CSV)"></a>
        <button class="btn" id="theme" data-tip="Light / dark" aria-label="Switch light or dark"></button>
        <button class="btn" id="logout" data-tip="Sign out" aria-label="Sign out"></button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="now" aria-selected="true"></button>
      <button role="tab" data-tab="students" aria-selected="false"></button>
      <button role="tab" data-tab="feedback" aria-selected="false"></button>
      <button role="tab" data-tab="episodes" aria-selected="false"></button>
      <button role="tab" data-tab="roster" aria-selected="false" hidden>Roster</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-now"></section>

  <section id="tab-students" hidden>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search name, ID or email">
      <div class="seg" id="stuSeg" role="group" aria-label="Show"></div>
      <span class="faint" id="count"></span>
      <button class="btn" id="resetAny" style="margin-left:auto" data-tip="For a student who forgot their password. Gives a temporary one that works once."></button>
    </div>
    <div id="resetAnyOut" class="card" style="padding:12px 14px;margin-bottom:12px" hidden></div>
    <div class="tablewrap"><table id="studentsTable"></table></div>
  </section>

  <section id="tab-feedback" hidden>
    <div class="toolbar">
      <select id="fbEp" aria-label="Episode"><option value="">All episodes</option></select>
      <div class="seg" id="fbSeg" role="group" aria-label="Which answers"></div>
      <input type="search" id="fbQ" placeholder="Search suggestions, names">
      <a class="btn" id="fbExport" href="/api/admin/feedback.csv" data-tip="Every answer, with the 11-star rating (CSV)"></a>
    </div>
    <div id="fbBody"></div>
  </section>

  <section id="tab-episodes" hidden>
    <div id="epAll"></div>
    <div class="card" style="margin-top:12px">
      <h2 id="epTitle"></h2>
      <div class="toolbar" style="margin-bottom:8px"><select id="epPick" aria-label="Episode"></select><span class="faint" id="epSummary"></span></div>
      <div id="epBody"></div>
    </div>
  </section>

  <section id="tab-roster" hidden>
    <div class="grid two" style="margin-top:0">
      <div class="card">
        <h2>Upload the student list</h2>
        <p class="muted">CSV with a header row: <b>student_id</b>, <b>name</b>, <b>batch</b> (student_id = NxtWave ID).</p>
        <input type="file" id="csvFile" accept=".csv,text/csv">
        <textarea id="csvText" rows="7" style="width:100%;margin-top:10px" placeholder="student_id,name,batch&#10;STU1001,Aarav Sharma,Beta-A"></textarea>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn primary" id="upload">Save roster</button>
          <label class="chk"><input type="checkbox" id="replace"> Replace the whole list</label>
        </div>
        <div id="uploadMsg" class="muted"></div>
      </div>
      <div class="card"><h2>On the roster, not started</h2><div id="notStarted"></div></div>
    </div>
  </section>
</main>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="head" id="dHead"></div>
    <div class="body" id="dBody"></div>
  </div>
</div>
<div id="tip" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const tip = $('#tip');
function showTip(e) {
  const t = e.target.closest?.('[data-tip]');
  if (!t || !t.dataset.tip) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect(), x = e.clientX ?? t.getBoundingClientRect().left, y = e.clientY ?? t.getBoundingClientRect().bottom;
  tip.style.left = `${Math.max(8, Math.min(innerWidth - r.width - 8, x + 12))}px`;
  tip.style.top = `${y + 16 + r.height > innerHeight ? y - r.height - 10 : y + 16}px`;
}
document.addEventListener('pointermove', showTip);
document.addEventListener('focusin', (e) => { const t = e.target.closest?.('[data-tip]'); if (t) { const b = t.getBoundingClientRect(); showTip({ target: t, clientX: b.left, clientY: b.bottom }); } });

async function api(path, opts) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts });
  if (res.status === 401 && path.startsWith('/api/admin')) { showLogin(); throw new Error('login'); }
  const body = res.headers.get('content-type')?.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error ?? res.statusText);
  return body;
}

// thin bars with a 4px rounded data end on the baseline; hairline grid; a wide invisible hit target per column for the tooltip
const barPath = (x, y, w, h, r = 4) => { r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
const niceMax = (m) => { if (m <= 4) return 4; const p = 10 ** Math.floor(Math.log10(m)), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 4 ? 4 : f <= 5 ? 5 : 10) * p; };
function columns(rows, { h = 150, every = 1, W = 600, bands = [] } = {}) {
  const pad = { l: 30, r: 4, t: bands.length ? 18 : 8, b: 20 }, iw = W - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = niceMax(Math.max(1, ...rows.map((r) => r.v)));
  const step = iw / rows.length, bw = Math.min(24, step * 0.66);
  let s = `<svg viewBox="0 0 ${W} ${h}" class="plot" role="img">`;
  for (const b of bands) s += `<rect class="band" x="${pad.l + b.from * step}" y="${pad.t - 14}" width="${(b.to - b.from) * step}" height="${ih + 14}" rx="6"/><text class="lab" x="${pad.l + ((b.from + b.to) / 2) * step}" y="${pad.t - 4}" text-anchor="middle">${esc(b.label)}</text>`;
  for (const f of [0, 0.5, 1]) { const y = pad.t + ih - f * ih; s += `<line class="gl" x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/><text class="ax" x="${pad.l - 6}" y="${y + 3}" text-anchor="end">${fmtNum(max * f)}</text>`; }
  rows.forEach((r, i) => {
    const cx = pad.l + i * step + step / 2, bh = (r.v / max) * ih;
    s += `<g data-tip="${esc(r.tip)}"><rect class="hit" x="${pad.l + i * step}" y="${pad.t}" width="${step}" height="${ih + pad.b}"/>${bh > 0 ? `<path class="bar ${r.cls ?? ''}" d="${barPath(cx - bw / 2, pad.t + ih - bh, bw, bh)}"/>` : ''}</g>`;
    if (i % every === 0) s += `<text class="ax" x="${cx}" y="${h - 5}" text-anchor="middle">${esc(r.x)}</text>`;
  });
  return `${s}</svg>`;
}
// horizontal bars, one series (or two overlaid: light = the whole, dark = the part)
const hbars = (rows) => `<div class="hb">${rows.map((r) => `<div class="nm" data-tip="${esc(r.tip ?? r.name)}">${r.html ?? esc(r.name)}</div>

const SX = (l, W = 300, pad = 10) => pad + ((l - 1) / 10) * (W - 2 * pad);
function strip(ep) {
  const W = 300, h = 26, counts = {};
  for (const r of ep.ratings) counts[r] = (counts[r] ?? 0) + 1;
  let s = `<svg viewBox="0 0 ${W} ${h}" class="plot" role="img" aria-label="${esc(`${ep.title}: ${ep.responses} ratings, median ${ep.median ?? '-'}`)}">`;
  s += `<rect class="band" x="${SX(5.5)}" y="1" width="${SX(7.5) - SX(5.5)}" height="${h - 2}" rx="4"/><line class="gl" x1="${SX(1)}" x2="${SX(11)}" y1="${h / 2}" y2="${h / 2}"/>`;
  for (const [l, c] of Object.entries(counts)) {
    const r = Math.min(11, 3 + 2.2 * Math.sqrt(c));
    s += `<g data-tip="${esc(`Episode ${ep.n} · ${l} of 11 (${LADDER[l]})\n${c} student${c > 1 ? 's' : ''}`)}"><circle class="hit" cx="${SX(+l)}" cy="${h / 2}" r="12"/><circle class="dot" cx="${SX(+l)}" cy="${h / 2}" r="${r}"/></g>`;
  }

  return `${s}</svg>`;
}

        <div class="hero"><div class="big">${scope.avg ?? '-'}<small> / 11</small></div>
          <div class="facts">${n ? `<span class="chip mute">${n} answers</span><span class="chip mute">median ${scope.median}</span>
            <span class="chip good">${ic('smile')}${pct(scope.delight, n)}% at 6+</span><span class="chip crit">${ic('frown')}${pct(scope.low, n)}% at 1-3</span>` : '<span class="faint">No 11-star answers yet</span>'}</div></div>
        ${columns(levels.map((l) => ({ v: l.n, x: l.level, tip: `${l.level} of 11: ${LADDER[l.level]}\n${l.n} answer${l.n === 1 ? '' : 's'}${n ? ` (${pct(l.n, n)}%)` : ''}` })), { h: 190, bands: [{ from: 5, to: 7, label: 'target' }] })}
        <div class="legend"><span>1-3 not working</span><span>4-5 as expected</span><span>6-7 target</span><span>8-11 beyond</span>${L.legacy ? `<span class="faint">+ ${L.legacy} earlier answers on the 5-star card (in the list, not in these numbers)</span>` : ''}</div>
      </div>
      <div class="card">
        <h2>${ic('layers')} By episode ${info('Every rating as a dot (bigger = more students). Black tick = median. Shaded = 6-7, the target. Right: answers, and the share at 6 or more.')}</h2>
        <div class="eprow head"><span></span>${stripAxis()}<span class="v">n</span><span class="v">6+</span></div>
        ${L.episodes.map((e) => `<div class="eprow"><span class="nm" data-tip="${esc(`Episode ${e.n}: ${e.title}${e.responses ? `\naverage ${e.avg} · median ${e.median}` : ''}`)}">${e.n}. ${esc(e.title)}</span>${e.responses ? strip(e) : '<span class="faint" style="font-size:12px">no answers yet</span>'}
          <span class="v">${e.responses || ''}</span><span class="v">${e.responses ? `${pct(e.delight, e.responses)}%` : ''}</span></div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>${ic('message')} ${m === 'suggestions' ? '"What would make it one star better?"' : 'Answers'} <span class="n">${voices.length}</span>${info('End-of-episode cards and chapter check-ins, newest first. Click one to see everything that student did.')}</h2>
      ${voices.length ? `<div class="wall">${voices.slice(0, state.wallAll ? 600 : 24).map(voiceCard).join('')}</div>
        ${voices.length > 24 ? `<div style="text-align:center;margin-top:12px"><button class="btn" id="wallMore">${state.wallAll ? 'Show the newest 24' : `Show all ${Math.min(600, voices.length)}`}</button></div>` : ''}
        ${state.wallAll && voices.length > 600 ? `<p class="faint">The newest 600 of ${voices.length}. The CSV has all.</p>` : ''}` : '<div class="empty">Nothing matches.</div>'}
    </div>
    <div class="grid three">
      <div class="card"><h2>${ic('smile')} How it felt</h2>${hbars(Object.entries(d.moods).map(([k, v]) => ({ name: k, html: `${ic(MOOD_ICON[k] ?? 'meh')} ${esc(k)}`, pct: (v / moodMax) * 100, text: fmtNum(v) })))}</div>
      <div class="card"><h2>${ic('code')} The SQL was</h2>${hbars([['easy', 'Too easy'], ['right', 'Just right'], ['hard', 'Too hard']].map(([k, l]) => ({ name: l, pct: (diff[k] / diffN) * 100, text: `${pct(diff[k], diffN)}%`, tip: `${l}: ${diff[k]} answers` })))}</div>
      <div class="card"><h2>${ic('check')} What they liked</h2>${d.liked.length ? hbars(d.liked.map((x) => ({ name: x.what, pct: (x.n / likedMax) * 100, text: fmtNum(x.n) }))) : '<div class="faint">Nothing picked yet.</div>'}</div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>${ic('message')} Chapter check-ins <span class="n">${fmtNum(d.checkpoints.responses)}</span>${info('The quick question after every chapter: Lost · Okay · Good · Great.\nA chapter is flagged when its average is under 2.5 or a quarter of students felt lost.')}</h2>
      ${byEp.size ? `<div class="chapters">${[...byEp].map(([s, cs]) => `<div class="row"><span class="nm">${s}. ${esc(epTitle(s))}</span><span class="cells">${cs.map((c) => {
        const bad = c.avg < 2.5 || c.lost / c.responses >= 0.25, ok = c.avg >= 3;
        return `<span class="chip ${bad ? 'crit' : ok ? 'good' : 'mute'}" data-tip="${esc(`Episode ${s}, chapter ${c.chapter}\naverage ${c.avg} of 4 · ${c.responses} answers · ${c.lost} felt lost`)}">${ic(bad ? 'frown' : ok ? 'smile' : 'meh')}Ch ${c.chapter} · ${c.avg}</span>`; }).join('')}</span></div>`).join('')}</div>`
        : '<div class="faint">No chapter check-ins yet.</div>'}
    </div>`;
  $('#fbBody').querySelectorAll('[data-id]').forEach((c) => c.onclick = () => openStudent(c.dataset.id));
  $('#wallMore')?.addEventListener('click', () => { state.wallAll = !state.wallAll; renderFeedback(); });
}
$('#fbEp').onchange = loadFeedback; $('#fbQ').oninput = renderFeedback;

// ---------------------------------------------------------------- EPISODES
function renderEpisodes() {
  const o = state.overview; if (!o) return;
  const L = o.ladder, maxS = Math.max(1, ...o.funnel.map((f) => f.started));
  $('#epAll').innerHTML = `<div class="card"><h2>${ic('layers')} All 13 episodes ${info('Click an episode for its steps. Bars: light = opened, blue = solved.')}</h2>
    <div class="tablewrap" style="border:0"><table><thead><tr><th class="nosort">Episode</th><th class="nosort">Opened → solved</th><th class="r nosort">Solved</th><th class="r nosort" data-tip="Average active minutes per student who played it">Avg time</th>
      <th class="r nosort" data-tip="SQL tasks solved on the first run">1st-try SQL</th><th class="r nosort">Hints</th><th class="r nosort">Traps</th><th class="r nosort" data-tip="Median of the 11-star ratings, and the share at 6 or more">Stars</th></tr></thead><tbody>
    ${o.funnel.map((f) => { const e = L.episodes[f.n - 1];
      return `<tr class="click${f.n === state.ep ? ' sel' : ''}" data-ep="${f.n}"><td><b>${f.n}.</b> ${esc(f.title)}</td>
      <td style="min-width:160px"><div class="hb" style="grid-template-columns:1fr auto"><div class="tr" data-tip="${esc(`${f.started} opened · ${f.completed} solved`)}"><b class="lite" style="width:${(f.started / maxS) * 100}%"></b><b style="width:${(f.completed / maxS) * 100}%"></b></div><div class="v">${f.completed}/${f.started}</div></div></td>
      <td class="r">${f.started ? `${f.completion_pct}%` : '-'}</td><td class="r">${f.avg_minutes ? `${f.avg_minutes}m` : '-'}</td><td class="r">${f.attempts ? `${f.first_pass_pct}%` : '-'}</td>
      <td class="r">${f.hints || '-'}</td><td class="r">${f.traps || '-'}</td><td class="r">${e?.responses ? `<span data-tip="${esc(`${e.responses} answers · average ${e.avg}`)}">${starsOf(e.median, 11)} <span class="faint">${pct(e.delight, e.responses)}%</span></span>` : '-'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="legend"><span><i style="background:var(--s1-2)"></i>Opened</span><span><i style="background:var(--s1)"></i>Solved</span></div></div>`;
  $('#epAll').querySelectorAll('tr[data-ep]').forEach((tr) => tr.onclick = () => { state.ep = Number(tr.dataset.ep); $('#epPick').value = state.ep; renderEpisodes(); loadEpisode(); $('#epTitle').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
}
async function loadEpisode() {
  const e = await api(`/api/admin/episodes/${state.ep}${qs()}`);
  const maxT = Math.max(1, ...e.beats.map((b) => b.avg_seconds));
  const worst = [...e.beats].sort((a, b) => b.here_now - a.here_now)[0];
  $('#epTitle').innerHTML = `${ic('book')} Episode ${e.n}: ${esc(e.title)} ${info('Every step. "Stopped here" = students who opened this episode, have not solved it, and whose next step is this one. Highlighted rows are where students get stuck.')}`;
  $('#epSummary').innerHTML = `${e.started} opened · ${e.completed} solved${worst?.here_now ? ` · most waiting on step ${worst.index + 1}` : ''}`;
  $('#epBody').innerHTML = e.started ? `<div class="tablewrap" style="border:0"><table><thead><tr><th class="nosort">#</th><th class="nosort">Step</th><th class="nosort">Reached it</th><th class="nosort">Avg time</th><th class="r nosort">SQL runs</th><th class="r nosort">Hints</th><th class="r nosort">Traps</th><th class="r nosort">Stopped here</th></tr></thead><tbody>
    ${e.beats.map((b) => `<tr class="${b.here_now >= Math.max(2, e.started * 0.05) ? 'hot' : ''}"><td class="faint">${b.index + 1}</td><td class="wrap">${typeChip(b.type)} ${esc(b.label)}</td>
      <td>${pbar(b.done_pct)}</td><td><div class="pb"><div class="tr"><b style="width:${(b.avg_seconds / maxT) * 100}%"></b></div><span>${dur(b.avg_seconds)}</span></div></td>
      <td class="r">${b.attempts || ''}</td><td class="r">${b.hints || ''}</td><td class="r">${b.traps || ''}</td><td class="r">${b.here_now ? `<b>${b.here_now}</b>` : ''}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Nobody has opened this episode yet.</div>';
}
$('#epPick').onchange = () => { state.ep = Number($('#epPick').value); renderEpisodes(); loadEpisode(); };

// ---------------------------------------------------------------- roster
function renderNotStarted() {
  const r = state.notStarted;
  $('#notStarted').innerHTML = r.length ? `<div class="tablewrap" style="max-height:420px"><table><thead><tr><th class="nosort">Name</th><th class="nosort">NxtWave ID</th><th class="nosort">Batch</th></tr></thead><tbody>${r.map((x) => `<tr><td>${esc(x.name ?? '-')}</td><td>${esc(x.student_id)}</td><td>${esc(x.batch ?? '-')}</td></tr>`).join('')}</tbody></table></div>`
    : `<div class="muted">${state.overview?.totals.roster ? 'Everyone on the roster has started.' : 'No roster uploaded yet.'}</div>`;
}
$('#csvFile').onchange = async () => { const f = $('#csvFile').files[0]; if (f) $('#csvText').value = await f.text(); };
$('#upload').onclick = async () => {
  const text = $('#csvText').value.trim();
  if (!text) { $('#uploadMsg').textContent = 'Choose a file or paste the CSV first.'; return; }
  if ($('#replace').checked && !confirm('Replace the whole roster with this list?')) return;
  try {
    const r = await api(`/api/admin/roster${$('#replace').checked ? '?replace=1' : ''}`, { method: 'POST', body: text });
    $('#uploadMsg').textContent = `Saved ${r.saved} students. Roster: ${r.roster} · played: ${r.roster_played} · not started: ${r.roster_not_started}.`;
    loadAll();
  } catch (e) { $('#uploadMsg').textContent = e.message; }
};

// ---------------------------------------------------------------- load
async function loadLive() {
  try { const l = await api(`/api/admin/live${qs()}`); $('#liveNow').innerHTML = `<i class="dot"></i>${l.count} playing now`;
    $('#liveNow').dataset.tip = l.count ? l.students.slice(0, 30).map((s) => `${s.name ?? s.student_id}: ${s.title ?? ''}`).join('\n') : 'Nobody in the last 5 minutes'; } catch { /* ignore */ }
}
async function loadBatches() {
  const b = await api('/api/admin/batches'), cur = $('#batch').value;
  $('#batch').innerHTML = '<option value="">All batches</option>' + b.map((x) => `<option value="${esc(x.batch)}">${esc(x.batch)} (${x.students})</option>`).join('');
  $('#batch').hidden = b.length < 2;
  $('#batch').value = cur;
}
async function loadAll() {
  const [o, s, fb] = await Promise.all([api(`/api/admin/overview${qs()}`), api(`/api/admin/students${qs()}`), api(`/api/admin/feedback${qs()}`).catch(() => null)]);
  state.overview = o; state.students = s.students; state.notStarted = s.not_started; state.fbAll = fb;
  state.need = new Map(o.attention.map((x) => [x.student_id, x.reasons]));
  const badge = $('[data-tab="students"] .badge'); badge.hidden = !o.attention.length; badge.textContent = o.attention.length; badge.dataset.tip = `${o.attention.length} need you`;
  $('#export').href = `/api/admin/export.csv${qs()}`;
  if (!$('#epPick').options.length) $('#epPick').innerHTML = o.funnel.map((f) => `<option value="${f.n}">${f.n}. ${esc(f.title)}</option>`).join('');
  if ($('#fbEp').options.length < 2) $('#fbEp').innerHTML += o.funnel.map((f) => `<option value="${f.n}">${f.n}. ${esc(f.title)}</option>`).join('');
  renderNow(); renderStudents(); renderNotStarted(); loadLive();
  if (state.tab === 'episodes') { renderEpisodes(); loadEpisode(); }
  if (state.tab === 'feedback') loadFeedback();
}
$('#batch').onchange = loadAll; $('#guests').onchange = loadAll; $('#refresh').onclick = () => { loadBatches(); loadAll(); };
async function boot() {
  try { await loadBatches(); } catch { return; }
  $('#login').hidden = true; $('#app').hidden = false;
  await loadAll();
}
setInterval(() => { if (!$('#app').hidden && !document.hidden && !state.student) loadAll().catch(() => {}); }, 120_000);
setInterval(() => { if (!$('#app').hidden && !document.hidden) loadLive(); }, 30_000);
boot();
</script>
</body>
</html>
