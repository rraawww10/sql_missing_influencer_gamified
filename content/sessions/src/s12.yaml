  - id: S12.17
    type: note
    rm_ref: { unit_id: 0aee01e4-7697-4aad-9d41-4996a143f8af, heading: "Transactions" }
    see_also:
      - { unit_id: 0aee01e4-7697-4aad-9d41-4996a143f8af, heading: "Atomicity" }
      - { unit_id: 0aee01e4-7697-4aad-9d41-4996a143f8af, heading: "Consistency" }
      - { unit_id: 0aee01e4-7697-4aad-9d41-4996a143f8af, heading: "Isolation" }
      - { unit_id: 0aee01e4-7697-4aad-9d41-4996a143f8af, heading: "Durability" }
    body: |
      A **transaction** is a group of SQL statements that belong together. Every transaction is **ACID**:
      - **Atomicity** — all statements are applied, or **none**.
      - **Consistency** — the database is always left in a consistent state.
      - **Isolation** — many transactions can run at once without harming each other.
      - **Durability** — once committed, changes **survive a crash**.

