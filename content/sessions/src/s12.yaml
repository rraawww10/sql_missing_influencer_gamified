  - id: S12.9
    type: task
    task_id: T12.5
    ask: "Which label payments are **above the average** payment? Show `payer`, `payee`, `amount`."
    ref: "SELECT payer, payee, amount FROM label_payments WHERE amount > (SELECT AVG(amount) FROM label_payments);"
    grading: { expect_rows: 9 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 85bae7a3-1e61-42d4-bbb0-08e9fc9fe646, heading: "Use a Subquery" } }
      - { tier: 2, skeleton: "SELECT payer, payee, amount FROM label_payments WHERE amount > (SELECT ____ FROM label_payments);" }
    traps:
      - id: aggregate_in_where
        rm_ref: { unit_id: 85bae7a3-1e61-42d4-bbb0-08e9fc9fe646, heading: "Why Does This Error Occur?" }
        sql: "SELECT payer, payee, amount FROM label_payments WHERE amount > AVG(amount);"
        match: error
        error_regex: "misuse of aggregate"
        reply: "`WHERE` checks one row at a time, so it can't use `AVG(...)` of all rows. Put the average in a **subquery**: `(SELECT AVG(amount) FROM label_payments)`."
      - id: two_columns_where
        rm_ref: { unit_id: 85bae7a3-1e61-42d4-bbb0-08e9fc9fe646, heading: "Mistake in WHERE Clause" }
        sql: "SELECT payer, payee, amount FROM label_payments WHERE amount > (SELECT amount, payment_id FROM label_payments);"
        match: error
        error_regex: "row value misused"
        reply: "A subquery used in a comparison must return **exactly one value** — one column, one row."
    reply_on_pass: "Nine payments above average — and one towers over the rest: **{{label}} → {{manager}}, ₹2,00,000** (the *advance* from S5-C3). Every other payment here is a normal label fee."

