    body: |
      `INSERT INTO` adds rows to a table. You can add many rows in one query:
      ```sql
      INSERT INTO table_name (column1, column2, ...)
      VALUES
        (value1, value2, ...),
        (value1, value2, ...);
      ```
      {{analyst.first}} warns: there are **4 common mistakes** with INSERT. He stamps every one in red.

