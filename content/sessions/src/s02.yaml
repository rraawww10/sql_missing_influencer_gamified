    traps:
      - id: M1
        rm_ref: { unit_id: 2f13bf2f-3532-4e12-9496-0715646dbbd0, heading: "Mistake 1" }
        sql: "INSERT INTO suspects (name, role, phone, age) VALUES ('{{manager}}', 'manager');"
        match: error
        error_regex: "^\\d+ values for \\d+ columns"
        reply: "🟥 {{analyst.first}}'s red stamp: **number of values ≠ number of columns**. You listed 4 columns, so every row needs 4 values."
      - id: M3
        rm_ref: { unit_id: 2f13bf2f-3532-4e12-9496-0715646dbbd0, heading: "Mistake 3" }
        sql: "INSERT INTO suspects (name, role, phone, age) VALUES (('{{manager}}', 'manager', '9876500002', 38), ('{{driver}}', 'cab driver', '9876500050', 45));"
        sql_regex: "VALUES\\s*\\(\\s*\\("
        match: error
        error_regex: "values for \\d+ columns"
        reply: "🟥 Red stamp: **no extra brackets after VALUES**. Write `VALUES (...), (...)`, not `VALUES ((...), (...))`."
