  - id: S2.2
    type: note
    rm_ref: { unit_id: ba96ed66-4cb3-4bd8-b7e7-4b176a7a0963, heading: "Data Types" }
    see_also:
      - { unit_id: ba96ed66-4cb3-4bd8-b7e7-4b176a7a0963, heading: "Introduction to SQL" }
    body: |
      Every column has a **data type**. These are used often:

      | Data type | Syntax |
      |---|---|
      | Integer | INTEGER / INT |
      | Float | FLOAT |
      | String | VARCHAR |
      | Text | TEXT |
      | Date | DATE |
      | Time | TIME |
      | Datetime | DATETIME |
      | Boolean | BOOLEAN |

      Notes: Boolean values are stored as integers **0 (FALSE)** and **1 (TRUE)**.
      A date looks like `'YYYY-MM-DD'`. A datetime looks like `'YYYY-MM-DD HH:MM:SS'`.

