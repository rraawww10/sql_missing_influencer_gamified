    ref: "UPDATE suspects SET alibi = 'In hotel lobby all evening' WHERE name = '{{manager}}';"
    grading:
      inspect: "SELECT name, alibi FROM suspects;"
    hints:
      - { tier: 1, rm_ref: { unit_id: 226c4f89-e296-4bb8-bcea-604a91a9b6d1, heading: "Update Specific Rows" } }
      - { tier: 2, skeleton: "UPDATE suspects SET alibi = '____' WHERE name = '____';" }
    traps:
      - id: update_all_alibis
        rm_ref: { unit_id: 226c4f89-e296-4bb8-bcea-604a91a9b6d1, heading: "Update All Rows" }
        sql: "UPDATE suspects SET alibi = 'In hotel lobby all evening';"
        inspect: "SELECT COUNT(DISTINCT alibi) FROM suspects;"
        match: result
        reply: "Oops — now all five 'were in the hotel lobby'. You forgot `WHERE` again. Reset and try once more."
    reply_on_pass: "Noted. We'll check every claim later. Claims are not proof."

  - id: S2.30
    type: activity
    kind: sort_into
    rm_ref: { unit_id: d9b767b9-9365-4148-be92-121cc88a071d, heading: "ALTER VS UPDATE" }
    prompt: "ALTER or UPDATE? Sort each change."
    buckets: ["ALTER (changes the table's layout)", "UPDATE (changes the data)"]
    items:
      - { text: "Add an `alibi` column", bucket: "ALTER (changes the table's layout)" }
      - { text: "Fix {{driver.first}}'s phone number", bucket: "UPDATE (changes the data)" }
      - { text: "Rename `role` to `relation_to_case`", bucket: "ALTER (changes the table's layout)" }
      - { text: "Write {{manager.first}}'s alibi", bucket: "UPDATE (changes the data)" }

  - id: S2.33
    type: check
    source: authored
    prompt: "Which command changes the **layout** of a table?"
    options:
      - { text: "UPDATE" }
      - { text: "ALTER", correct: true }
      - { text: "INSERT" }
      - { text: "SELECT" }
    explain: "ALTER adds, renames or drops columns. UPDATE only changes the data inside."

  - id: S2.34
    type: hook
    speaker: system
    body: |
      📧 Hotel security: "Attaching the gate log — **300 entries** since noon."
      {{mentor.first}}: "That service lift opens near the service gate. Find who used it."

exit:
