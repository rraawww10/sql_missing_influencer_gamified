# Session 7 — "Smartwatch Secrets" (9:00 PM). Flow: docs/SESSION_PLAN.md › Session 7.
session: 7
title: "Smartwatch Secrets"
story_clock: "2026-12-12 21:00:00"
course_topic_id: e4e8f7c2-036d-457c-a60f-866c35b0417b
snapshot: s07
est_minutes: 50
reading_materials:
  - { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, role: primary }   # RM #19 SQL Expression
  - { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, role: primary }   # RM #20 SQL Functions
  - { unit_id: 7aea2483-8eea-4ded-a05a-19c2f1044e2b, role: primary }   # RM #21 Cast Functions
  - { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, role: primary }   # RM #22 Arithmetic Functions

x-fix: &fix "UPDATE watch_log SET distance_m = distance_m / 100 WHERE ts >= '2026-12-12 18:00:00';"

beats:
  - id: S7.1
    type: scene
    speaker: analyst
    body: "{{star.first}}'s watch log: `watch_log` — one row every 5 minutes with `steps`, `distance_m`, `heart_rate` and her `resting_hr`."

  - id: S7.2
    type: note
    rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Arithmetic Operators in SQL" }
    see_also:
      - { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Expressions in Querying" }
    body: "SQL can calculate: `+` add · `-` subtract · `*` multiply · `/` divide · `%` remainder."

  - id: S7.3
    type: task
    task_id: T7.1
    minutes: 2
    ask: "For every log, show `ts` and how much her heart rate was **above resting** (`heart_rate - resting_hr`) as `hr_rise`."
    ref: "SELECT ts, heart_rate - resting_hr AS hr_rise FROM watch_log;"
    grading: { expect_rows: 216 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Arithmetic Operators in SQL" } }
      - { tier: 2, skeleton: "SELECT ts, heart_rate ____ resting_hr AS hr_rise FROM watch_log;" }

  - id: S7.4
    type: task
    task_id: T7.2
    minutes: 2
    ask: "Show `ts` and the distance in **kilometres** (`distance_m / 1000.0`) as `distance_km`."
    ref: "SELECT ts, distance_m / 1000.0 AS distance_km FROM watch_log;"
    grading: { expect_rows: 216 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Arithmetic Operators in SQL" } }
      - { tier: 2, skeleton: "SELECT ts, distance_m ____ 1000.0 AS distance_km FROM watch_log;" }
    reply_on_pass: "Look at the evening rows — 11 km in 5 minutes while sitting still? Something's wrong with the evening export. Keep reading."

  - id: S7.5
    type: task
    task_id: T7.3
    minutes: 2
    ask: "The watch syncs fully every 15 minutes, i.e. every 3rd log. Show all the details of logs whose `log_id` divides evenly by 3."
    ref: "SELECT * FROM watch_log WHERE log_id % 3 = 0;"
    grading: { expect_rows: 72 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Arithmetic Operators in SQL" } }
      - { tier: 2, skeleton: "SELECT * FROM watch_log WHERE log_id ____ 3 = 0;" }

  - id: S7.6
    type: note
    rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Using Expressions in SELECT Clause" }
    body: "Expressions can build new columns. `||` joins text together in SQLite: `name || ' - ' || genre`."

  - id: S7.7
    type: task
    task_id: T7.4
    minutes: 2
    ask: "For log `147` only, show one column like `2026-12-12 18:10:00 - 112 bpm` (time, ` - `, heart rate, ` bpm`)."
    ref: "SELECT ts || ' - ' || heart_rate || ' bpm' AS reading FROM watch_log WHERE log_id = 147;"
    grading: { expect_rows: 1 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Using Expressions in SELECT Clause" } }
      - { tier: 2, skeleton: "SELECT ts || ' - ' || ____ || ' bpm' AS reading FROM watch_log WHERE log_id = 147;" }

  - id: S7.8
    type: note
    rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Using Expressions in WHERE Clause" }
    body: "Expressions work inside `WHERE` too: `WHERE (collection - budget) >= 50`."

  - id: S7.9
    type: task
    task_id: T7.5
    ask: "Find her **heart-rate spikes**: all the details of logs where `heart_rate - resting_hr` is **40 or more**."
    ref: "SELECT * FROM watch_log WHERE (heart_rate - resting_hr) >= 40;"
    grading: { expect_rows: 2 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Using Expressions in WHERE Clause" } }
      - { tier: 2, skeleton: "SELECT * FROM watch_log WHERE (heart_rate - resting_hr) ____ 40;" }
    reply_on_pass: "Two spikes: **18:10** (112 bpm — when she realised the car wasn't going to the stadium) and **19:00** (109 bpm — just before her ₹1 message)."

  - id: S7.10
    type: note
    rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Using Expressions in UPDATE Clause" }
    body: "Expressions can fix data with `UPDATE`: `UPDATE movie SET rating = rating / 2;`"

  - id: S7.11
    type: task
    task_id: T7.6
    ask: "{{analyst.first}}: \"The evening export saved distance in **centimetres**.\" Fix it: from 6 PM onwards, divide `distance_m` by 100."
    ref: *fix
    grading:
      inspect: "SELECT log_id, distance_m FROM watch_log;"   # whole table: forgetting WHERE must not pass
    hints:
      - { tier: 1, rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Using Expressions in UPDATE Clause" } }
      - { tier: 2, skeleton: "UPDATE watch_log SET distance_m = distance_m ____ 100 WHERE ts >= '2026-12-12 18:00:00';" }
    traps:
      - id: update_all
        rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Using Expressions in UPDATE Clause" }
        sql: "UPDATE watch_log SET distance_m = distance_m / 100;"
        inspect: "SELECT COUNT(*) FROM watch_log WHERE ts < '2026-12-12 18:00:00' AND distance_m <> CAST(ROUND(steps * 0.7) AS INTEGER);"
        match: result
        reply: "That fixed the evening — and broke the morning. Without `WHERE`, every row was divided. Only rows from 6 PM onwards were in centimetres."

  - id: S7.12
    type: note
    rm_ref: { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, heading: "SQL Function Categories" }
    see_also:
      - { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, heading: "SQL Functions" }
      - { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, heading: "Date Functions" }
    body: "SQL functions come in groups: **date** functions, **cast** functions and **arithmetic** functions."

  - id: S7.13
    type: note
    rm_ref: { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, heading: "strftime()" }
    see_also:
      - { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, heading: "How to use strftime()" }
    body: |
      `strftime(format, field)` pulls a part out of a date or datetime, **as text**:
      `%Y` year · `%m` month · `%d` day · `%H` hour. Example: `strftime('%H', ts)` → `'18'`.

  - id: S7.14
    type: task
    task_id: T7.8
    ask: "Steps per **hour**: show the hour (`strftime('%H', ts)`) as `hour` and `SUM(steps)` as `steps`, one row per hour."
    ref: "SELECT strftime('%H', ts) AS hour, SUM(steps) AS steps FROM watch_log GROUP BY hour;"
    grading: { expect_rows: 18 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, heading: "How to use strftime()" } }
      - { tier: 2, skeleton: "SELECT strftime('%H', ts) AS hour, SUM(steps) AS steps FROM watch_log GROUP BY ____;" }
    reply_on_pass: "After 19:00 — **zero steps**. She's sitting in one place."

  - id: S7.15
    type: note
    rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Expressions in HAVING Clause" }
    body: "Expressions work inside `HAVING` too: `HAVING AVG(collection - budget) >= 100`."

  - id: S7.16
    type: task
    task_id: T7.7
    minutes: 2
    ask: "Which hours had an **average** heart-rate rise above 25? Show just the `hour`."
    ref: "SELECT strftime('%H', ts) AS hour FROM watch_log GROUP BY hour HAVING AVG(heart_rate - resting_hr) > 25;"
    grading: { expect_rows: 1 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 47e1c94f-6264-46e7-9dc3-21425c3fba6d, heading: "Expressions in HAVING Clause" } }
      - { tier: 2, skeleton: "SELECT strftime('%H', ts) AS hour FROM watch_log GROUP BY hour HAVING AVG(____ - ____) > 25;" }

  - id: S7.17
    type: note
    rm_ref: { unit_id: 7aea2483-8eea-4ded-a05a-19c2f1044e2b, heading: "CAST Function" }
    see_also:
      - { unit_id: 7aea2483-8eea-4ded-a05a-19c2f1044e2b, heading: "CAST Function Syntax and Examples" }
    body: "`CAST(value AS data_type)` changes a value's type. `CAST(strftime('%H', ts) AS INTEGER)` turns `'18'` into the number 18."

  - id: S7.18
    type: task
    task_id: T7.9
    ask: "All the details of logs from hour **18 onwards**, comparing the hour as a **number**."
    ref: "SELECT * FROM watch_log WHERE CAST(strftime('%H', ts) AS INTEGER) >= 18;"
    grading: { expect_rows: 72 }
    hints:
      - { tier: 1, rm_ref: { unit_id: 7aea2483-8eea-4ded-a05a-19c2f1044e2b, heading: "CAST Function Syntax and Examples" } }
      - { tier: 2, skeleton: "SELECT * FROM watch_log WHERE CAST(strftime('%H', ts) AS ____) >= 18;" }
    traps:
      - id: text_vs_number
        rm_ref: { unit_id: 0447ed54-9507-4895-bc17-c3a9fa8b76c8, heading: "How to use strftime()" }
        sql: "SELECT * FROM watch_log WHERE strftime('%H', ts) >= 18;"
        match: result
        reply: "Every row came back — even 6 AM! `strftime` gives **text** ('06'), and SQLite treats text as bigger than any number. `CAST` it to INTEGER first."

  - id: S7.19
    type: note
    rm_ref: { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "Arithmetic Functions" }
    see_also:
      - { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "FLOOR Function" }
      - { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "CEIL Function" }
      - { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "ROUND Function" }
    body: "`FLOOR(x)` rounds down · `CEIL(x)` rounds up · `ROUND(x, n)` rounds to n decimal places."

  - id: S7.20
    type: task
    task_id: T7.10
    ask: "How far did she walk after **18:45**? Show the total distance in km as `ROUND(…, 1)`, `CEIL(…)` and `FLOOR(…)` — in that order. (The cm fix is already applied.)"
    setup: [*fix]
    ref: "SELECT ROUND(SUM(distance_m) / 1000.0, 1) AS km, CEIL(SUM(distance_m) / 1000.0) AS km_ceil, FLOOR(SUM(distance_m) / 1000.0) AS km_floor FROM watch_log WHERE ts >= '2026-12-12 18:45:00';"
    grading: { expect_rows: 1 }
    hints:
      - { tier: 1, rm_ref: { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "ROUND Function" } }
      - { tier: 2, skeleton: "SELECT ROUND(SUM(distance_m) / 1000.0, ____), CEIL(SUM(distance_m) / 1000.0), FLOOR(SUM(distance_m) / 1000.0) FROM watch_log WHERE ts >= '2026-12-12 18:45:00';" }
    reply_on_pass: "About **0.2 km** — she walked only 200 metres from where the car stopped."

  - id: S7.21
    type: note
    rm_ref: { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "String Functions" }
    body: "`UPPER()` and `LOWER()` change text case — great for case-insensitive search: `UPPER(name) LIKE UPPER('%avengers%')`."

  - id: S7.22
    type: task
    task_id: T7.11
    ask: "Decode the ₹1 note (S5-C1: `gReEn aCrEs`). The capitals hide a name — so ignore letter case. From `upi_payments`, show `from_name`, `to_name`, `amount`, `note`, `ts` where the note contains **green acres** in **any** letter case."
    ref: "SELECT from_name, to_name, amount, note, ts FROM upi_payments WHERE UPPER(note) LIKE UPPER('%green acres%');"
    grading: { expect_rows: 2 }
    hints:
      - { tier: 1, rm_ref: { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "String Functions" } }
      - { tier: 2, skeleton: "SELECT from_name, to_name, amount, note, ts FROM upi_payments WHERE ____(note) LIKE ____('%green acres%');" }
    on_pass: { clue: S7-C1 }
    reply_on_pass: "Two rows — two different people wrote the same place."

  - id: S7.22b
    type: check
    source: authored
    rm_ref: { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "String Functions" }
    prompt: "Your two rows: who wrote *green acres*, and when?"
    options:
      - { text: "{{manager.first}} at 16:10 (₹45,000 to {{farm}}, '2 guests') — and {{star.first}}'s watch at 19:02 (₹1 to {{sister.first}}, 'gReEn aCrEs')", correct: true }
      - { text: "Only {{star.first}} — the ₹45,000 row is a different place" }
      - { text: "Only {{manager.first}} — the ₹1 note says something else" }
    explain: "Case-insensitive search matched both notes: *Green Acres - 2 guests* (16:10:05) and *gReEn aCrEs* (19:02:30). Same place. She typed the name of the farm stay her manager paid for."

  - id: S7.23
    type: clue
    clue_id: S7-C1
    requires_task: T7.11
    title: "Green Acres"
    body: "Your case-insensitive search: {{star.first}}'s capitals **`gReEn aCrEs`** (19:02) match **{{farm}}** — the farm stay {{manager.first}} paid ₹45,000 for at **16:10**, *2 guests* (S5-C2). She is telling us where she is."

  - id: S7.24
    type: check
    source: authored
    rm_ref: { unit_id: c5402661-b12c-404a-9a1c-744e12ad836a, heading: "ROUND Function" }
    prompt: "What is `ROUND(16.25, 1)`?"
    options:
      - { text: "16.3", correct: true }
      - { text: "16.2" }
      - { text: "16" }
    explain: "ROUND to 1 decimal place looks at the next digit (5) and rounds up: 16.3."

  - id: S7.25
    type: hook
    speaker: system
    body: "📱 Trending: **#{{fan.first}}Knows** — the {{fan_handle}} admin posted *\"she's safe, trust me\"* at 8:55 PM. {{mentor.first}}: \"Let's clear people properly — with data, not hashtags.\""

exit:
  required_clues: [S7-C1]
  required_beats: [S7.3, S7.4, S7.5, S7.7, S7.9, S7.11, S7.14, S7.16, S7.18, S7.20, S7.22, S7.22b]

